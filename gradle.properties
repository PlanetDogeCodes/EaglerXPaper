eaglerxserver.group=net.lax1dude.eaglercraft.backend
eaglerxserver.version=1.1.1
eaglerxserver.url=https://lax1dude.net/eaglerxserver/

# Constrain memory for low-RAM containers
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
